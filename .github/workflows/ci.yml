name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
      - run: cargo +stable test --release --locked
      - run: cargo +stable build --release --locked
      - name: Bounded CLI stress and benchmark smoke
        if: runner.os == 'Linux'
        run: python3 tools/quality_checks.py --cases 64 --mib 1 --runs 2 --output target/quality-smoke.json
