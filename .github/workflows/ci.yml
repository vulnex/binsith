name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable test --release --locked
      - run: cargo +stable build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Folder filesystem identities and volume capabilities
        run: python tools/check_folder_filesystems.py --output target/fs19-filesystems.json
      - name: Windows ACL, junction, long-path and console behavior
        if: runner.os == 'Windows'
        run: |
          python tools/check_folder_windows.py --binary target/debug/binsith.exe --output target/fs19-windows-debug.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_folder_windows.py --binary target/release/binsith.exe --output target/fs19-windows-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows repeated console events with blocked report writers
        if: runner.os == 'Windows'
        run: |
          python tools/check_folder_windows_shutdown.py --profile debug --output target/fs19-windows-shutdown-debug.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_folder_windows_shutdown.py --profile release --output target/fs19-windows-shutdown-release.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native terminal and closed-pipe behavior
        if: runner.os != 'Windows'
        run: |
          python tools/check_folder_progress.py --binary target/debug/binsith
          python tools/check_folder_progress.py --binary target/release/binsith
      - name: README folder examples
        if: runner.os != 'Windows'
        run: python tools/check_folder_examples.py --output target/folder-examples.json
      - name: Folder benchmark and scale validator contracts
        run: python -m unittest discover -s tools -p 'test_folder*.py'
      - name: JSON and CSV standard-consumer compatibility
        run: python tools/check_export_compatibility.py
      - name: Preserve filesystem capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-evidence-${{ matrix.os }}
          path: |
            target/folder-examples.json
            target/fs19-filesystems.json
            target/fs19-windows-*.json
          if-no-files-found: warn
      - name: Bounded CLI stress and benchmark smoke
        if: runner.os == 'Linux'
        run: python3 tools/quality_checks.py --cases 64 --mib 1 --runs 2 --output target/quality-smoke.json
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check CLI and fuzz dependency alignment
        run: |
          python tools/check_fuzz_alignment.py
          python -m unittest discover -s tools -p 'test_fuzz*.py'
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: mkdir -p fuzz/corpus/strings && cp fuzz/seeds/strings/* fuzz/corpus/strings/
      - name: Bounded sanitizer fuzz smoke
        run: cargo +nightly fuzz run strings fuzz/corpus/strings -- -max_total_time=15 -runs=10000 -max_len=8192 -timeout=5 -rss_limit_mb=1024 -seed=45335
