name: Release packages
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional full source commit SHA for rebuilding a historical release'
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/release-packages.yml'
      - 'tools/package_release.py'
      - 'tools/build_release.py'
      - 'tools/check_package_privacy.py'
      - 'tools/test_package_privacy.py'
      - 'tools/check_folder_examples.py'
      - 'README.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/release-packages.yml'
      - 'tools/package_release.py'
      - 'tools/build_release.py'
      - 'tools/check_package_privacy.py'
      - 'tools/test_package_privacy.py'
      - 'tools/check_folder_examples.py'
      - 'README.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  package:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve committed source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: packaging-tools
      - name: Check out the workflow source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          path: release-source
          fetch-depth: 0
      - name: Verify immutable source selection
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit || github.sha }}
        shell: python
        run: |
          import os, re, subprocess
          expected = os.environ['EXPECTED_SOURCE']
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('Source must be a full immutable commit SHA')
          actual = subprocess.check_output(['git', '-C', 'release-source', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected:
              raise SystemExit('Source checkout identity mismatch')
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private repository content
        working-directory: release-source
        run: python tools/check_repository_privacy.py
      - run: rustup toolchain install stable --profile minimal
      - name: Verify package privacy checks
        working-directory: packaging-tools
        run: python -m unittest discover -s tools -p 'test_package_privacy.py'
      - name: Verify release source
        working-directory: release-source
        run: cargo +stable test --release --locked
      - name: Build native release binary
        env:
          RUSTUP_TOOLCHAIN: stable
        run: python packaging-tools/tools/build_release.py --root release-source
      - name: Check JSON and CSV consumers
        run: python release-source/tools/check_export_compatibility.py
      - name: Package and smoke-test extracted binary
        run: python packaging-tools/tools/package_release.py --root release-source
      - uses: actions/upload-artifact@v4
        with:
          name: binsith-${{ matrix.target }}
          path: |
            release-source/dist/*.tar.gz
            release-source/dist/*.zip
            release-source/dist/SHA256SUMS-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
